name: ems
description: "A flutter based Employment Management System (E.M.S) App"

publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  get_it: ^8.0.3
  go_router: ^14.8.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.6
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1
  injectable: ^2.5.0
  package_info_plus: ^8.3.0
  uih: ^1.0.5
  flutter_secure_storage: ^4.2.1
  flutter_launcher_icons: ^0.14.3
  flutter_gen_runner: ^5.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  mockito: ^5.4.5
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  injectable_generator: ^2.7.0
  package_rename: ^1.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logos/
    - assets/icons/